services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "0393146946"
      MYSQL_DATABASE: phuyen_travel_5
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - REACT_APP_API_BASE_URL=http://backend:5000/api
    depends_on:
      - backend

volumes:
  db_data: